name: Update watermarking papers

on:
  workflow_dispatch:
  schedule:
    # 01:23 UTC = 09:23 Asia/Shanghai. An off-hour minute reduces scheduler congestion.
    - cron: "23 1 * * *"

permissions:
  contents: write

concurrency:
  group: watermarking-arxiv-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Update papers
        run: python daily_arxiv.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/papers.json
          if git diff --cached --quiet; then
            echo "No paper changes"
            exit 0
          fi
          git commit -m "Update watermarking papers"
          git push
